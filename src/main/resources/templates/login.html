<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            border: 1px solid #e2e8f0;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section h1 {
            color: #1e293b;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .logo-section p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .btn:hover {
            background: #2563eb;
        }

        .btn:active {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            background: white;
            padding: 0 16px;
            color: #6b7280;
            font-size: 14px;
        }

        .alert {
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 6px;
            font-size: 14px;
        }

        .alert-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                margin: 10px;
            }

            .logo-section h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo-section">
        <h1>관리자 시스템</h1>
        <p>송장 관리 시스템에 오신 것을 환영합니다</p>
    </div>

    <!-- 알림 메시지 -->
    <div id="alertMessage" style="display: none;"></div>

    <!-- 로그인 폼 -->
    <form id="loginForm">
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn">로그인</button>
    </form>

    <div class="divider">
        <span>또는</span>
    </div>

    <!-- 회원가입 버튼 -->
    <button type="button" class="btn btn-secondary" onclick="showSignupForm()">회원가입</button>

    <!-- 회원가입 폼 (숨겨진 상태) -->
    <form id="signupForm" style="display: none;">
        <div class="form-group">
            <label for="signupUsername">아이디</label>
            <input type="text" class="form-control" id="signupUsername" name="username" required>
        </div>

        <div class="form-group">
            <label for="signupPassword">비밀번호</label>
            <input type="password" class="form-control" id="signupPassword" name="password" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">비밀번호 확인</label>
            <input type="password" class="form-control" id="confirmPassword" required>
        </div>

        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="address">주소</label>
            <input type="text" class="form-control" id="address" name="address" required>
        </div>

        <button type="submit" class="btn">회원가입</button>
        <button type="button" class="btn btn-secondary" onclick="showLoginForm()">로그인으로 돌아가기</button>
    </form>
</div>

<script>
    function showAlert(message, type) {
        const alertDiv = document.getElementById('alertMessage');
        alertDiv.className = 'alert alert-' + type;
        alertDiv.textContent = message;
        alertDiv.style.display = 'block';

        setTimeout(() => {
            alertDiv.style.display = 'none';
        }, 5000);
    }

    function showSignupForm() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('signupForm').style.display = 'block';
        document.querySelector('.divider').style.display = 'none';
        document.querySelector('.btn-secondary').style.display = 'none';
    }

    function showLoginForm() {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('signupForm').style.display = 'none';
        document.querySelector('.divider').style.display = 'block';
        document.querySelector('.btn-secondary').style.display = 'block';
    }

    // 로그인 폼 처리
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData(this);
        const loginData = {
            username: formData.get('username'),
            password: formData.get('password')
        };

        fetch('/api/v1/users/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(loginData)
        })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('로그인에 실패했습니다.');
                }
            })
            .then(data => {
                // userId를 localStorage에 저장
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('username', loginData.username);
                // 대시보드로 이동
                window.location.href = '/page/v1/dashboard';
            })
            .catch(error => {
                showAlert(error.message, 'error');
            });
    });

    // 회원가입 폼 처리
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const password = document.getElementById('signupPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            showAlert('비밀번호가 일치하지 않습니다.', 'error');
            return false;
        }

        const formData = new FormData(this);
        const signupData = {
            username: formData.get('username'),
            password: formData.get('password'),
            name: formData.get('name'),
            address: formData.get('address')
        };

        fetch('/api/v1/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(signupData)
        })
            .then(response => {
                if (response.ok) {
                    showAlert('회원가입이 완료되었습니다.', 'success');
                    setTimeout(() => {
                        showLoginForm();
                    }, 2000);
                } else {
                    throw new Error('회원가입에 실패했습니다.');
                }
            })
            .catch(error => {
                showAlert(error.message, 'error');
            });
    });
</script>
</body>
</html>
