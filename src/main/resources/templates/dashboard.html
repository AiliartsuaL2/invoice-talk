<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>송짱톡 - 심플 리스트</title>
    <style>
        :root{
            --bg: #f7f8fa;
            --card: #ffffff;
            --muted: #8b94a6;
            --accent-1: linear-gradient(90deg,#3b82f6,#7c3aed);
            --accent-2: #667eea;
            --radius: 12px;
            --shadow-sm: 0 6px 18px rgba(33,33,33,0.06);
        }

        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background:var(--bg);
            color:#222;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            min-height:100vh;
            padding-bottom:48px;
        }

        /* Header */
        .header{
            background: linear-gradient(90deg,#fff 0%, #fff 40%);
            padding:20px 24px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            position:sticky;
            top:0;
            z-index:50;
        }
        .header-inner{
            max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
        }
        .brand{
            display:flex;align-items:center;gap:12px;
        }
        .logo-badge{
            width:44px;height:44px;border-radius:10px;
            background: linear-gradient(135deg,#3b82f6,#7c3aed);
            display:flex;align-items:center;justify-content:center;color:white;font-weight:700;
            box-shadow: var(--shadow-sm);
            font-size:18px;
        }
        .brand h1{font-size:18px;font-weight:700;color:#0f1724}
        .user-area{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600}
        .logout-btn{
            background:transparent;border:1px solid rgba(15,23,36,0.06);padding:8px 12px;border-radius:10px;font-weight:600;cursor:pointer;
        }

        /* Container */
        .container{max-width:1200px;margin:28px auto;padding:0 20px;}

        .dashboard-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
        .title{
            display:flex;flex-direction:column;
        }
        .title .big{font-size:20px;font-weight:700;color:#0f1724}
        .title .sub{font-size:12px;color:var(--muted);margin-top:4px}

        /* Stats pills (simple) */
        .pills{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
        .pill{
            background:#fff;padding:10px 14px;border-radius:999px;border:1px solid rgba(15,23,36,0.04);
            display:flex;flex-direction:column;align-items:center;min-width:96px;cursor:pointer;box-shadow:var(--shadow-sm);
            transition:transform .12s ease, box-shadow .12s ease;
        }
        .pill:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(33,33,33,0.08)}
        .pill .num{font-weight:700;font-size:16px;color:#0f1724}
        .pill .lbl{font-size:12px;color:var(--muted);margin-top:4px}

        /* Actions */
        .actions{display:flex;gap:12px;align-items:center}
        /* Toss-style primary button: flat, bold, rounded */
        .btn{
            border:0;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;display:inline-flex;gap:10px;align-items:center;justify-content:center;
            box-shadow:none;transition:transform .12s ease, box-shadow .12s ease;
        }
        .btn:active{transform:translateY(1px)}
        .btn-primary{
            background: linear-gradient(90deg,#3b82f6,#7c3aed);
            color:#fff;padding:10px 16px;border-radius:12px;
            box-shadow: 0 6px 18px rgba(124,58,237,0.12);
        }
        .btn-ghost{
            background:transparent;border:1px solid rgba(15,23,36,0.06);color:#0f1724;padding:10px 14px;border-radius:12px;
        }

        /* Table area -> use card list rows with simple grid */
        .list-card{
            background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-top:18px;
        }
        .list-header{
            padding:16px 20px;border-bottom:1px solid rgba(15,23,36,0.04);display:flex;align-items:center;justify-content:space-between;
        }
        .search-area{display:flex;gap:10px;align-items:center}
        .search{
            border-radius:10px;border:1px solid rgba(15,23,36,0.06);padding:8px 12px;background:#fafafa;width:320px;
        }

        .table-body{max-height:62vh;overflow:auto}
        .row{
            display:grid;grid-template-columns: 2fr 1fr 1.2fr 1fr 1fr 1fr;gap:12px;padding:14px 18px;align-items:center;border-bottom:1px solid rgba(15,23,36,0.03);
            cursor:pointer;transition:background .08s ease;
        }
        .row:hover{background:rgba(99,102,241,0.04)}
        .cell-title{font-weight:700;color:#0f1724;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .cell-sub{font-size:12px;color:var(--muted);margin-top:4px}
        .cell-muted{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

        /* Status pill with more visibility */
        .status-pill{
            display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;font-weight:700;font-size:13px;
            box-shadow:0 3px 8px rgba(15,23,36,0.06);
        }
        .status-SUCCESS{background: linear-gradient(90deg, #d4f5e9, #d4f5e9); color:#0b6b3a; border:1px solid rgba(11,107,58,0.08)}
        .status-PENDING{background: linear-gradient(90deg,#fff7e6,#fff7e6); color:#8a5e00; border:1px solid rgba(138,94,0,0.06) }
        .status-ERROR{background: linear-gradient(90deg,#ffecec,#ffecec); color:#7a1f1f; border:1px solid rgba(122,31,31,0.06) }

        .status-icon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}

        /* Loading */
        .loading{display:flex;align-items:center;gap:10px;padding:18px;color:var(--muted)}
        .spinner{
            width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,0.06);border-top:2px solid #667eea;animation:spin 1s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Empty */
        .empty{padding:32px;text-align:center;color:var(--muted)}

        /* Modals */
        .modal{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(10,11,12,0.36);z-index:120;align-items:center;justify-content:center;padding:20px}
        .modal.show{display:flex}
        .modal-panel{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:720px;box-shadow:0 30px 60px rgba(15,23,36,0.12);overflow:auto;max-height:90vh}
        .modal-head{display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:6px;border-bottom:1px solid rgba(15,23,36,0.04)}
        .modal-head .status-big{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
        .modal-head .status-big .icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center}
        .modal-body{padding-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .prop{background:#fafafa;padding:12px;border-radius:10px;border:1px solid rgba(15,23,36,0.03)}
        .prop-label{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
        .prop-val{font-weight:700;color:#0f1724;word-break:break-word}
        .modal-actions{display:flex;justify-content:center;margin-top:16px;gap:12px}
        .close-ghost{background:transparent;border:1px solid rgba(15,23,36,0.06);padding:10px 14px;border-radius:10px}

        /* Add invoice modal smaller */
        .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
        input[type="text"], select{padding:10px;border-radius:8px;border:1px solid rgba(15,23,36,0.06)}
        .file-upload-area{border:1px dashed rgba(15,23,36,0.06);padding:16px;border-radius:10px;text-align:center;background:#fafbff;cursor:pointer}

        /* Responsive */
        @media (max-width:900px){
            .row{grid-template-columns: 1.6fr 1fr 1fr 1fr 1fr 1fr}
            .modal-body{grid-template-columns:1fr}
        }
        @media (max-width:520px){
            .pill{min-width:84px}
            .search{width:160px}
            .row{grid-template-columns:1fr 1fr;grid-auto-rows:auto;gap:6px;padding:12px}
            .row .cell:nth-child(n+3){display:none}
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-inner">
        <div class="brand">
            <div class="logo-badge">송</div>
            <div>
                <h1>송짱톡</h1>
                <div class="sub" style="font-size:12px;color:var(--muted)">송장 관리 시스템</div>
            </div>
        </div>

        <div style="display:flex;align-items:center;gap:12px">
            <div class="user-area">
                <div id="usernameDisplay">관리자</div>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </div>
</div>

<main class="container">
    <div class="dashboard-top">
        <div class="title">
            <div class="big">송장 관리</div>
            <div class="sub">목록을 클릭하면 상세를 확인할 수 있습니다.</div>
        </div>

        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div class="pills" id="pillsContainer">
                <div class="pill" onclick="loadInvoiceList('ALL')">
                    <div class="num" id="totalCount">0</div>
                    <div class="lbl">전체</div>
                </div>
                <div class="pill" onclick="loadInvoiceList('SUCCESS')">
                    <div class="num" id="successCount">0</div>
                    <div class="lbl">완료</div>
                </div>
                <div class="pill" onclick="loadInvoiceList('PENDING')">
                    <div class="num" id="pendingCount">0</div>
                    <div class="lbl">처리중</div>
                </div>
                <div class="pill" onclick="loadInvoiceList('ERROR')">
                    <div class="num" id="errorCount">0</div>
                    <div class="lbl">에러</div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-ghost" onclick="openExcelModal()">
                    <!-- simple icon -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden><path d="M19 9l-7 7-5-5" stroke="#0f1724" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    엑셀 업로드
                </button>
                <button class="btn btn-primary" onclick="openAddModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    송장 추가
                </button>
            </div>
        </div>
    </div>

    <div class="list-card" role="region" aria-label="송장 목록">
        <div class="list-header">
            <div style="display:flex;align-items:center;gap:12px">
                <div style="font-weight:700">송장 내역</div>
                <div style="font-size:13px;color:var(--muted)">간결한 뷰 — 클릭하여 상세 보기</div>
            </div>

            <div class="search-area">
                <input class="search" id="searchInput" placeholder="검색 (상품명, 송장번호, 받는사람)" oninput="applySearch()" />
            </div>
        </div>

        <div id="tableLoading" class="loading" style="display:none"><div class="spinner"></div><div>불러오는 중…</div></div>

        <div class="table-body" id="invoiceTableBody">
            <!-- rows injected here -->
        </div>
        <div id="emptyState" class="empty" style="display:none">등록된 송장이 없습니다.</div>
    </div>
</main>

<!-- 상세 모달 -->
<div id="detailModal" class="modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <div class="modal-head">
            <div class="status-big" id="detailStatusArea">
                <!-- icon + status text injected -->
            </div>
            <div id="detailSubtitle" style="font-size:13px;color:var(--muted)"></div>
        </div>

        <div class="modal-body" id="detailBody">
            <!-- props injected -->
        </div>

        <div class="modal-actions">
            <button class="close-ghost" onclick="closeModal('detailModal')">닫기</button>
        </div>
    </div>
</div>

<!-- 추가 모달 (추가 전용) -->
<div id="invoiceModal" class="modal" aria-hidden="true">
    <div class="modal-panel" style="max-width:560px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div style="font-weight:800">송장 추가</div>
            <button class="close-ghost" onclick="closeModal('invoiceModal')">취소</button>
        </div>

        <form id="invoiceForm">
            <input type="hidden" id="invoiceId" name="id" />
            <div class="form-row">
                <label class="prop-label">택배회사</label>
                <input type="text" id="courierName" name="courierName" required />
            </div>
            <div class="form-row">
                <label class="prop-label">송장번호</label>
                <input type="text" id="number" name="number" required />
            </div>
            <div class="form-row">
                <label class="prop-label">상품명</label>
                <input type="text" id="name" name="name" required />
            </div>
            <div class="form-row">
                <label class="prop-label">보내는 주소</label>
                <input type="text" id="sendAddress" name="sendAddress" required />
            </div>
            <div class="form-row">
                <label class="prop-label">받는 주소</label>
                <input type="text" id="receiveAddress" name="receiveAddress" required />
            </div>
            <div class="form-row">
                <label class="prop-label">받는 사람</label>
                <input type="text" id="receiverName" name="receiverName" required />
            </div>

            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
                <button type="button" class="close-ghost" onclick="closeModal('invoiceModal')">취소</button>
                <button type="submit" class="btn btn-primary">저장</button>
            </div>
        </form>
    </div>
</div>

<!-- 엑셀 업로드 모달 -->
<div id="excelModal" class="modal" aria-hidden="true">
    <div class="modal-panel" style="max-width:520px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div style="font-weight:800">엑셀 업로드</div>
            <button class="close-ghost" onclick="closeModal('excelModal')">취소</button>
        </div>

        <form id="excelForm" enctype="multipart/form-data">
            <div class="form-row">
                <div class="file-upload-area" onclick="document.getElementById('excelFile').click()">
                    <input type="file" id="excelFile" name="file" accept=".xlsx,.xls" style="display:none" onchange="handleFileSelect(event)" />
                    <div id="uploadText"><strong>엑셀 파일을 끌어오거나 클릭하세요</strong><div style="font-size:12px;color:var(--muted)">.xlsx, .xls</div></div>
                </div>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">
                <button type="button" class="close-ghost" onclick="closeModal('excelModal')">취소</button>
                <button type="submit" class="btn btn-primary">업로드</button>
            </div>
        </form>
    </div>
</div>

<script>
    // --- 유틸 / 헤더 ---
    function getAuthHeaders() {
        const userId = localStorage.getItem('userId');
        return {
            'Content-Type': 'application/json',
            'user-id': userId
        };
    }

    document.addEventListener('DOMContentLoaded', () => {
        const userId = localStorage.getItem('userId');
        if (!userId) {
            alert('로그인이 필요합니다.');
            window.location.href = '/page/v1/login';
            return;
        }
        const username = localStorage.getItem('name');
        if (username) {
            document.getElementById('usernameDisplay').textContent = username + '님';
        }
        loadDashboardData();
    });

    // --- 대시보드 로드 ---
    function loadDashboardData() {
        loadCountData();
        loadInvoiceList('ALL');
    }

    function loadCountData() {
        fetch('/api/v1/invoices/count', { method: 'GET', headers: getAuthHeaders() })
            .then(res => res.json())
            .then(data => {
                document.getElementById('totalCount').textContent = data.allCount ?? 0;
                document.getElementById('successCount').textContent = data.successCount ?? 0;
                document.getElementById('pendingCount').textContent = data.pendingCount ?? 0;
                document.getElementById('errorCount').textContent = data.errorCount ?? 0;
            })
            .catch(err => {
                console.error('count load err', err);
            });
    }

    // 검색 필터 적용 (클라이언트 사이드)
    let lastLoadedInvoices = [];
    function applySearch(){
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!lastLoadedInvoices || lastLoadedInvoices.length === 0) return;
        if (!q) {
            renderInvoiceTable(lastLoadedInvoices);
            return;
        }
        const filtered = lastLoadedInvoices.filter(inv => {
            return (inv.name||'').toLowerCase().includes(q)
                || (inv.number||'').toLowerCase().includes(q)
                || (inv.receiverName||'').toLowerCase().includes(q);
        });
        renderInvoiceTable(filtered);
    }

    // --- 리스트 로드 & 렌더 ---
    function loadInvoiceList(status){
        const loading = document.getElementById('tableLoading');
        const body = document.getElementById('invoiceTableBody');
        const empty = document.getElementById('emptyState');

        loading.style.display = 'flex';
        body.innerHTML = '';
        empty.style.display = 'none';

        fetch(`/api/v1/invoices?status=${encodeURIComponent(status)}&pageNumber=1&size=100`, {
            method: 'GET',
            headers: getAuthHeaders()
        })
            .then(res => res.json())
            .then(data => {
                loading.style.display = 'none';
                // API가 페이지 형태로 넘기면 data.content 등 처리 필요. 하지만 기존 코드는 배열을 기대했으므로 유연하게 처리.
                const invoices = Array.isArray(data) ? data : (data.content || data.items || []);
                lastLoadedInvoices = invoices;
                renderInvoiceTable(invoices);
            })
            .catch(err => {
                loading.style.display = 'none';
                body.innerHTML = '<div class="empty">데이터를 불러오는데 실패했습니다.</div>';
                console.error('invoice list err', err);
            });
    }

    function renderInvoiceTable(invoices){
        const container = document.getElementById('invoiceTableBody');
        const empty = document.getElementById('emptyState');
        if (!invoices || invoices.length === 0) {
            container.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        // only show 6 columns: 상품명(name), 상태, 송장번호(number), 택배사(courierName), 등록일(createdAt), 받는사람(receiverName)
        const rows = invoices.map(inv => {
            const createdAt = inv.createdAt ? new Date(inv.createdAt).toLocaleString('ko-KR') : '-';
            const statusText = getStatusText(inv.status);
            return `
          <div class="row" role="button" tabindex="0" onclick="openInvoiceDetail(${inv.id})" onkeydown="if(event.key==='Enter'){openInvoiceDetail(${inv.id})}">
            <div>
              <div class="cell-title">${escapeHtml(inv.name || '-')}</div>
              <div class="cell-sub">${escapeHtml(inv.courierName || '')}${inv.name ? ' · ' + escapeHtml(inv.number || '') : ''}</div>
            </div>
            <div>
              <div class="cell-muted">${escapeHtml(statusText)}</div>
            </div>
            <div>
              <div class="cell-muted">${escapeHtml(inv.number || '-')}</div>
            </div>
            <div><div class="cell-muted">${escapeHtml(inv.courierName || '-')}</div></div>
            <div><div class="cell-muted">${escapeHtml(createdAt)}</div></div>
            <div><div class="cell-muted">${escapeHtml(inv.receiverName || '-')}</div></div>
          </div>
        `;
        }).join('');
        container.innerHTML = rows;
    }

    function escapeHtml(str){
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    function getStatusText(status){
        switch(status){
            case 'PENDING': return '대기';
            case 'SUCCESS': return '완료';
            case 'ERROR': return '에러';
            default: return status || '-';
        }
    }

    // --- 상세 조회 (리스트 클릭시) ---
    function openInvoiceDetail(id){
        // 불러오기 전 모달 표시(로딩) 혹은 스켈레톤; 여기선 모달을 열고 로딩 상태 표시
        const m = document.getElementById('detailModal');
        m.classList.add('show');
        m.setAttribute('aria-hidden','false');
        document.getElementById('detailStatusArea').innerHTML = `<div style="color:var(--muted)">로딩 중…</div>`;
        document.getElementById('detailSubtitle').textContent = '';

        fetch(`/api/v1/invoices/${id}`, { method: 'GET', headers: getAuthHeaders() })
            .then(res => res.json())
            .then(data => {
                // data should contain the properties specified by user
                renderDetailModal(data);
            })
            .catch(err => {
                console.error('detail err', err);
                document.getElementById('detailStatusArea').innerHTML = `<div style="color:var(--muted)">상세 정보를 불러오지 못했습니다.</div>`;
            });
    }

    function renderDetailModal(inv){
        // status area: big center with icon
        const statusText = getStatusText(inv.status);
        const statusClass = `status-${inv.status || 'PENDING'}`;
        const iconHtml = getStatusIcon(inv.status);
        document.getElementById('detailStatusArea').innerHTML = `
        <div class="icon" style="background:transparent">${iconHtml}</div>
        <div style="display:flex;flex-direction:column;align-items:center">
          <div style="font-size:18px;font-weight:900">${escapeHtml(statusText)}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">${escapeHtml(inv.courierName || '')} · ${escapeHtml(inv.number || '')}</div>
        </div>
      `;

        const subtitle = `등록일: ${inv.createdAt ? new Date(inv.createdAt).toLocaleString('ko-KR') : '-'}${inv.scannedAt ? ' · 스캔: ' + new Date(inv.scannedAt).toLocaleString('ko-KR') : ''}`;
        document.getElementById('detailSubtitle').textContent = subtitle;

        // build props
        const props = [
            {label:'ID', val: inv.id},
            {label:'상태', val: statusText},
            {label:'택배회사', val: inv.courierName},
            {label:'송장번호', val: inv.number},
            {label:'상품명', val: inv.name},
            {label:'보내는 주소', val: inv.sendAddress},
            {label:'받는 주소', val: inv.receiveAddress},
            {label:'받는 사람', val: inv.receiverName},
            {label:'스캔 일시', val: inv.scannedAt ? new Date(inv.scannedAt).toLocaleString('ko-KR') : '-' },
            {label:'등록일', val: inv.createdAt ? new Date(inv.createdAt).toLocaleString('ko-KR') : '-'},
            {label:'수정일', val: inv.updatedAt ? new Date(inv.updatedAt).toLocaleString('ko-KR') : '-'}
        ];

        const body = document.getElementById('detailBody');
        body.innerHTML = props.map(p => `
        <div class="prop">
          <div class="prop-label">${escapeHtml(p.label)}</div>
          <div class="prop-val">${escapeHtml(p.val ?? '-')}</div>
        </div>
      `).join('');
    }

    function getStatusIcon(status){
        // simple inline SVGs styled for visibility
        if (status === 'SUCCESS') {
            return `<svg width="42" height="42" viewBox="0 0 24 24" fill="none" aria-hidden>
          <rect width="42" height="42" rx="8" fill="#e6fbef"/>
          <path d="M20 6L9 17l-5-5" stroke="#0b6b3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
        } else if (status === 'PENDING') {
            return `<svg width="42" height="42" viewBox="0 0 24 24" fill="none" aria-hidden>
          <rect width="42" height="42" rx="8" fill="#fffaf0"/>
          <path d="M12 6v6l4 2" stroke="#8a5e00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
        } else {
            return `<svg width="42" height="42" viewBox="0 0 24 24" fill="none" aria-hidden>
          <rect width="42" height="42" rx="8" fill="#fff3f3"/>
          <path d="M12 9v4" stroke="#7a1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 17h.01" stroke="#7a1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
        }
    }

    function closeModal(id){
        const m = document.getElementById(id);
        if (!m) return;
        m.classList.remove('show');
        m.setAttribute('aria-hidden','true');
    }

    // --- Add invoice form handling (PUT, same as before) ---
    document.getElementById('invoiceForm').addEventListener('submit', function(e){
        e.preventDefault();
        const form = e.currentTarget;
        const fd = new FormData(form);
        const isEdit = !!document.getElementById('invoiceId').value;

        const data = {
            courierName: String(fd.get('courierName') || '').trim(),
            number: String(fd.get('number') || '').trim(),
            name: String(fd.get('name') || '').trim(),
            sendAddress: String(fd.get('sendAddress') || '').trim(),
            receiveAddress: String(fd.get('receiveAddress') || '').trim(),
            receiverName: String(fd.get('receiverName') || '').trim()
        };

        // allow for edit path if needed in future, but default to PUT create as original code
        fetch('/api/v1/invoices', {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify(data)
        })
            .then(res => {
                if (res.ok) {
                    closeModal('invoiceModal');
                    loadDashboardData();
                } else {
                    res.text().then(t => { alert('추가에 실패했습니다. ' + (t || '')); });
                }
            })
            .catch(err => {
                console.error('add err', err);
                alert('추가 중 오류가 발생했습니다.');
            });
    });

    // --- Excel upload handling (POST multipart) ---
    document.getElementById('excelForm').addEventListener('submit', function(e){
        e.preventDefault();
        const fileInput = document.getElementById('excelFile');
        if (!fileInput.files || !fileInput.files[0]) {
            alert('파일을 선택해주세요.');
            return;
        }
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        fetch('/api/v1/invoices/excel', {
            method: 'POST',
            headers: { 'User-Id': localStorage.getItem('userId') },
            body: formData
        })
            .then(res => {
                if (res.ok) {
                    alert('엑셀 업로드가 완료되었습니다.');
                    closeModal('excelModal');
                    loadDashboardData();
                } else {
                    res.text().then(t => alert('업로드 실패: ' + (t || '')));
                }
            })
            .catch(err => {
                console.error('excel upload err', err);
                alert('업로드 중 오류가 발생했습니다.');
            });
    });

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            document.getElementById('uploadText').innerHTML = `<div><strong>${escapeHtml(file.name)}</strong></div><div style="font-size:12px;color:var(--muted)">파일이 선택되었습니다</div>`;
        }
    }

    // 파일 드래그 앤 드롭 간단 처리
    (function setupDrag(){
        const area = document.querySelector('.file-upload-area');
        if (!area) return;
        area.addEventListener('dragover', e => { e.preventDefault(); area.style.borderColor = '#667eea'; area.style.background = '#f3f5ff'; });
        area.addEventListener('dragleave', e => { e.preventDefault(); area.style.borderColor = ''; area.style.background = ''; });
        area.addEventListener('drop', e => {
            e.preventDefault();
            area.style.borderColor = ''; area.style.background = '';
            const files = e.dataTransfer.files;
            if (files.length) {
                document.getElementById('excelFile').files = files;
                handleFileSelect({ target: { files } });
            }
        });
    })();

    // open add modal
    function openAddModal(){
        document.getElementById('invoiceForm').reset();
        document.getElementById('invoiceId').value = '';
        document.getElementById('invoiceModal').classList.add('show');
        document.getElementById('invoiceModal').setAttribute('aria-hidden','false');
    }
    function openExcelModal(){
        document.getElementById('excelForm').reset();
        document.getElementById('excelModal').classList.add('show');
        document.getElementById('excelModal').setAttribute('aria-hidden','false');
        document.getElementById('uploadText').innerHTML = `<p>📄 클릭하거나 파일을 드래그하여 업로드</p><small style="color:var(--muted)">엑셀 파일만 업로드 가능합니다 (.xlsx, .xls)</small>`;
    }

    function logout(){
        if (confirm('로그아웃 하시겠습니까?')) {
            localStorage.removeItem('userId');
            localStorage.removeItem('name');
            window.location.href = '/page/v1/login';
        }
    }

    // 도움: ESC로 모달 닫기, 외부 클릭 닫기
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            ['detailModal','invoiceModal','excelModal'].forEach(id => closeModal(id));
        }
    });
    window.addEventListener('click', (e) => {
        ['detailModal','invoiceModal','excelModal'].forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            if (e.target === el) closeModal(id);
        });
    });
</script>
</body>
</html>
